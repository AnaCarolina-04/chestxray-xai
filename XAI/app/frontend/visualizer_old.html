<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNN Visualizer - ChestXRay XAI</title>
    
    <!-- D3.js for visualization -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <!-- Visualization CSS -->
    <link rel="stylesheet" href="/css/visualizer.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a2240 100%);
            color: #e8eaf6;
            overflow: hidden;
            height: 100vh;
        }

        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(26, 34, 64, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(100, 181, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #64b5f6 0%, #42a5f5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .back-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #1976d2 0%, #1565c0 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .header .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(25, 118, 210, 0.4);
        }

        /* Main Canvas Area */
        .canvas-area {
            flex: 1;
            margin-top: 60px;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px;
        }

        #network-canvas {
            width: 100%;
            min-height: calc(100vh - 80px);
        }

        /* Side Panel */
        .side-panel {
            width: 400px;
            margin-top: 60px;
            background: rgba(26, 34, 64, 0.95);
            backdrop-filter: blur(10px);
            border-left: 2px solid rgba(100, 181, 246, 0.3);
            padding: 25px;
            overflow-y: auto;
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.3);
        }

        .panel-section {
            background: rgba(42, 54, 84, 0.6);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(100, 181, 246, 0.2);
        }

        .panel-section h2 {
            font-size: 18px;
            font-weight: 700;
            color: #64b5f6;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(100, 181, 246, 0.3);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
        }

        .info-label {
            color: #90caf9;
            font-weight: 600;
        }

        .info-value {
            color: #e8eaf6;
            font-family: 'Courier New', monospace;
        }

        .activation-btn {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: linear-gradient(135deg, #1976d2 0%, #1565c0 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .activation-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(25, 118, 210, 0.4);
        }

        .activation-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #activation-display {
            margin-top: 15px;
            text-align: center;
        }

        #activation-display img {
            max-width: 100%;
            border-radius: 12px;
            border: 2px solid rgba(100, 181, 246, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .loading {
            padding: 20px;
            text-align: center;
            color: #64b5f6;
            font-size: 14px;
        }

        .error {
            padding: 15px;
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.5);
            border-radius: 8px;
            color: #ef5350;
            font-size: 14px;
            margin-top: 10px;
        }

        /* Network Visualization Styles */
        .layer-block {
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .layer-block:hover .layer-rect {
            filter: brightness(1.3);
            stroke-width: 3;
        }

        .layer-rect {
            transition: all 0.3s ease;
        }

        .layer-rect.selected {
            stroke: #ffeb3b;
            stroke-width: 4;
            filter: drop-shadow(0 0 10px rgba(255, 235, 59, 0.6));
        }

        .layer-text {
            pointer-events: none;
            user-select: none;
        }

        .layer-connection {
            stroke: rgba(100, 181, 246, 0.3);
            stroke-width: 2;
            fill: none;
            transition: all 0.3s ease;
        }

        .layer-connection.active {
            stroke: rgba(255, 235, 59, 0.8);
            stroke-width: 3;
            animation: flow 2s linear infinite;
        }

        @keyframes flow {
            0% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: -20; }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(26, 34, 64, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(100, 181, 246, 0.4);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 181, 246, 0.6);
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1>🧠 CNN Model Visualizer</h1>
        <a href="/" class="back-btn">← Back to App</a>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Canvas Area -->
        <div class="canvas-area">
            <svg id="network-canvas"></svg>
        </div>

        <!-- Side Panel -->
        <div class="side-panel">
            <div class="panel-section">
                <h2>📊 Layer Information</h2>
                <div id="layer-info">
                    <p style="color: #90caf9; font-size: 14px;">Click on a layer to view details</p>
                </div>
            </div>

            <div class="panel-section">
                <h2>🔬 Activations</h2>
                <button id="get-activations-btn" class="activation-btn" disabled>
                    Get Layer Activations
                </button>
                <div id="activation-display"></div>
            </div>

            <div class="panel-section">
                <h2>ℹ️ Model Info</h2>
                <div id="model-info">
                    <div class="loading">Loading model information...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Visualizer JavaScript -->
    <script src="/js/visualizer.js"></script>
</body>
</html>
